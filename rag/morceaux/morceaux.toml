(comme `audio_manager` pour le volume) l'emploie au démarrage et à chaque changement."""
pieges = [
    """Fichier absent : `ConfigFile.load` rend `ERR_FILE_NOT_FOUND` (mesuré) ; c'est le cas normal au premier lancement, \
