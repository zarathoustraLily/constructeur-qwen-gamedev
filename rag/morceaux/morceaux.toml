# Catalogue de morceaux de code du RAG (étape R2 du suivi). Une entrée par savoir-faire ; son exemple vérifié est dans
# <id>/exemple/ : le code du morceau, rangé comme dans le plan (il garde ce chemin dans le projet de vérification), et
# exemple.gd, qui l'emploie et mesure son comportement. `python -m usine.rag.morceaux verifier` le lance dans
# Godot 4.7.2 puis réécrit <id>/fiche.md à partir de ce texte, du code vérifié et de la mesure écrite par l'exemple.
# `socle` : fichiers du socle (godot/socle_jeu/) qu'emploie le morceau, copiés à leur place.
# Chaque piège est mesuré par l'exemple, cité dans sa source, renvoie au plan, ou est marqué « non mesuré ici ».

[etat_etourdi]
titre = "Ajouter un état à un acteur : étourdi après un coup (machine à états du socle)"
fait = """\
Un nouvel état, « étourdi », pour un acteur piloté par la `StateMachine` du socle : un coup le fait entrer dans \
l'état, qui décompte sa durée (lue dans les données de l'acteur) dans `physics_update`, puis demande le retour au \
repos par `transition_requested`."""
quand = """\
Étourdissement, recul, gel, sort qui immobilise, temps de récupération après une attaque : tout comportement \
temporaire d'un acteur."""
rangement = """\
Dans un projet qui suit le plan : l'état dans `3_entities/<acteur>/states/<acteur>_<etat>.gd`, un nœud de ce nom dans \
la `StateMachine` de la scène de l'acteur, la durée dans la classe de `1_core/data/` et sa valeur dans le `.tres` de \
`5_data/` (principe 2) ; le test dans `7_tests/3_entities/<acteur>/`."""
socle = ["1_core/process_order.gd", "1_core/state_machine/state.gd", "1_core/state_machine/state_machine.gd"]
pieges = [
    """Le décompte avance dans `physics_update` : il s'arrête quand l'arbre est en pause (mesuré : 60 images de pause \
au milieu, l'étourdissement dure 60 images de plus en temps réel). Un décompte dans `_process` ou un minuteur de \
`get_tree().create_timer(durée)` sans `false` continuerait (principe du plan SIM-08).""",
    """Un nœud hérite du `process_mode` de son parent : sous un parent `PROCESS_MODE_ALWAYS`, l'acteur ignore la pause ; \
il faut le remettre en `PROCESS_MODE_PAUSABLE` (mesuré par l'exemple, dont la racine compte pendant la pause).""",
    """Un décompte en `float` comparé à 0 seul dure une image de trop quand la durée tombe juste : 0,5 s ôtées par \
pas de 1/60 laissent un reste infime au-dessus de 0 (mesuré : 31 images avec `<= 0.0` seul, 30 avec \
`is_zero_approx`).""",
    """Le nom passé à `transition_requested` est celui du nœud de l'état, en minuscules (`&"stunned"` pour le nœud \
`Stunned`) : la `StateMachine` du socle range ses états ainsi (principe du plan : un comportement = un état).""",
    """L'acteur appelle vers le bas (`state_machine.transition_to`) et signale vers le haut (`stunned`) ; sa vue écoute \
le signal pour montrer l'étourdissement (principe 1 du plan).""",
]

[camera_suivi_lisse]
titre = "Caméra qui suit sa cible en douceur, à la même vitesse quelle que soit la cadence"
fait = """\
La caméra rattrape sa cible avec retard : à chaque image, elle parcourt une part `1 - exp(-smoothing × delta)` du \
chemin qui reste. Après une même durée, elle est au même endroit à 30 ou à 120 images par seconde."""
quand = "Caméra à la troisième personne, vue de dessus, caméra de course, curseur ou viseur qui suit la souris."
rangement = """\
Dans un projet qui suit le plan : un mécanisme générique dans `1_core/camera/`, comme la `ShakeCamera3D` du cours \
roguelike ; ses réglages sont exportés et posés dans la scène du niveau ; elle bouge dans `_process` (présentation, \
règle SIM-01 du plan) et reçoit sa cible par `setup()` (principe 4)."""
pieges = [
    """`lerp(cible, smoothing × delta)` dépend de la cadence (mesuré : après 0,2 s, il reste 3,349 m à 30 images/s et \
3,601 m à 120, contre 3,679 m pour les deux avec `1 - exp(-smoothing × delta)`).""",
    """La caméra suit la cible après que celle-ci a bougé : une cible déplacée dans `_physics_process` et une caméra dans \
`_process` peuvent trembler quand les deux cadences diffèrent ; l'interpolation de physique \
(`physics/common/physics_interpolation`) les accorde (godot-docs, physics_interpolation ; non mesuré ici).""",
]

[inventaire_piles]
titre = "Inventaire à emplacements avec piles d'objets"
fait = """\
Un composant d'inventaire à emplacements : chaque objet (une ressource `ItemData` de `5_data/items/`) s'empile \
jusqu'à son `max_stack` ; ajouter remplit d'abord les piles du même objet puis les emplacements vides, et rend ce qui \
n'a pas trouvé de place ; retirer vide d'abord les dernières piles. Le signal `changed` prévient la vue."""
quand = "Sac du joueur, coffre, boutique, barre d'objets rapides, munitions."
rangement = """\
Dans un projet qui suit le plan : la définition des objets dans `1_core/data/item_data.gd` et un `.tres` par objet \
dans `5_data/items/` (principe 2) ; le composant dans `1_core/components/` (un composant par responsabilité) ; \
l'affichage dans `4_ui/`, qui écoute `changed`."""
pieges = [
    """Deux objets s'empilent s'ils ont le même `id`, pas s'ils sont le même objet : `duplicate()` donne un autre objet \
de même id (mesuré : 2 potions copiées s'empilent avec les autres).""",
    """`add` rend le reste : un ramassage doit le laisser au sol, pas le perdre (mesuré : épée refusée, reste 1, \
inventaire plein).""",
    """Les définitions (`ItemData`) restent immuables pendant la partie ; le nombre d'exemplaires vit dans le \
composant (principe du plan DAT-04).""",
]

[generation_graine]
titre = "Génération procédurale reproductible : graine et RandomNumberGenerator"
fait = """\
Une grotte creusée par une marche au hasard sur une grille. Le hasard vient d'un `RandomNumberGenerator` reçu en \
paramètre : même graine, même grotte ; autre graine, autre grotte."""
quand = """\
Donjons, grottes, placement d'objets, niveaux du jour (une graine par jour), parties rejouables, tests qui doivent \
redonner le même résultat."""
rangement = """\
Dans un projet qui suit le plan : l'outil générique dans `1_core/procedural/` ; le générateur reçoit le \
`RandomNumberGenerator` en dépendance (règle SIM-09 du plan : un tirage qui compte vient d'un générateur reçu, \
`randf()` seulement dans une vue)."""
pieges = [
    """Réemployer le même générateur sans remettre sa graine donne une autre grotte : son état a avancé (mesuré). \
`rng.seed = graine` remet l'état (mesuré : même grotte).""",
    """Les fonctions globales `randi()`, `randf()`, `pick_random()` ne passent pas par le générateur reçu : elles \
cassent la reproduction (principe du plan SIM-09 ; non mesuré ici).""",
    """`size / 2` sur un `Vector2i` est une division entière : l'avertissement `integer_division`, une erreur avec les \
réglages du plan, la vise aussi (mesuré : « Integer division. Decimal part will be discarded. ») ; écrire \
`floori(size.x / 2.0)`.""",
]

