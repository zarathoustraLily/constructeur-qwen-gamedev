titre = "Terrain en relief tiré d'un bruit (FastNoiseLite, SurfaceTool)"
fait = """\
Une grille de sommets soulevés par `FastNoiseLite.get_noise_2d` × hauteur, deux triangles par carré, normales \
calculées par `SurfaceTool.generate_normals()`. Même graine du bruit, même terrain."""
quand = "Terrain, collines, fond marin, relief d'une carte ; base d'un monde ouvert ou d'une île générée."
rangement = """\
Dans un projet qui suit le plan : l'outil commun de maillage dans `1_core/procedural/` ; un générateur `@tool` et sa \
scène dans `6_assets/Mesh/Procedural/<famille>/`, ses réglages (graine, taille, hauteur) dans `5_data/DECORS/` \
(section 6 des règles du dépôt)."""
pieges = [
    """L'ordre des sommets d'un triangle décide de sa face avant, donc du sens des normales de `generate_normals()` \
(mesuré : avec l'ordre du morceau, normale moyenne vers +Y).""",
    """`get_noise_2d` rend une valeur entre -1 et 1 : la hauteur reste dans [-height, height] (mesuré).""",
    """`commit_to_arrays()` donne les tableaux sans passer par le serveur de rendu : on peut les lire et les tester \
sans fenêtre (mesuré).""",
]

[vision_ennemi]
titre = "Vision d'un ennemi : portée, cône et ligne de visée (raycast)"
fait = """\
Une cible est vue si elle est assez proche, dans le cône devant l'acteur, et si aucun obstacle des couches surveillées \
ne coupe la ligne de visée (`PhysicsDirectSpaceState3D.intersect_ray`)."""
quand = "Garde qui repère le joueur, tourelle, caméra de surveillance, ennemi qui décide de poursuivre."
rangement = """\
Dans un projet qui suit le plan : un composant dans `1_core/components/`, posé dans la scène de l'ennemi ; ses \
réglages sont tirés des données de l'ennemi (`5_data/`) ; l'état de l'ennemi (`states/`) l'interroge dans \
`physics_update`."""
pieges = [
    """Un mur posé arrête le rayon tout de suite, sans attendre une image de physique (mesuré, moteur physique par \
défaut de Godot 4.7.2). Les zones (`Area3D`), elles, ne voient un corps qu'après des images de physique (voir la \
fiche des couches et masques).""",
    """Le rayon part du centre de l'acteur : le masque ne doit pas contenir la couche de l'acteur lui-même, sinon il se \
voit (non mesuré ici ; `PhysicsRayQueryParameters3D.exclude` sert aussi).""",
    """L'avant d'un `Node3D` est -Z (`-global_basis.z`) : godot-docs, « Introduction to 3D » (non mesuré ici).""",
]

