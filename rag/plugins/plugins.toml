# Plugins conseillés par le RAG (décision 9 de laurent). Un bloc par plugin ; l'archive est téléchargée dans
# donnees/plugins/archives/<id>/<fichier> et vérifiée par son SHA-256. Les autoloads sont ceux que le plugin pose
# quand on l'active dans l'éditeur (_enable_plugin) ; le projet de vérification les déclare directement.
# Vérification : python -m usine.rag.plugins verifier [id …]

[phantom_camera]
nom = "Phantom Camera"
depot = "ramokz/phantom-camera"
version = "v0.11.0.3"
licence = "MIT"
url = "https://codeload.github.com/ramokz/phantom-camera/zip/refs/tags/v0.11.0.3"
fichier = "v0.11.0.3.zip"
sha256 = "42b4bbd7ce6efa726abc6e927328d349887c9343fe53900a5083860c1848749b"
addons = ["phantom-camera-0.11.0.3/addons/phantom_camera"]
autoloads = { PhantomCameraManager = "*res://addons/phantom_camera/scripts/managers/phantom_camera_manager.gd" }

[limboai]
nom = "LimboAI"
depot = "limbonaut/limboai"
version = "v1.8.1"
licence = "MIT"
url = "https://github.com/limbonaut/limboai/releases/download/v1.8.1/limboai%2Bv1.8.1.gdextension-4.6.zip"
fichier = "limboai+v1.8.1.gdextension-4.6.zip"
sha256 = "0910411f8dbc0da8920f6c8bbbb6397c347cd9f2f193942468a702dfb11d5f0e"
addons = ["addons/limboai"]

[beehave]
nom = "Beehave"
depot = "bitbrain/beehave"
version = "v2.9.3"
licence = "MIT"
url = "https://codeload.github.com/bitbrain/beehave/zip/refs/tags/v2.9.3"
fichier = "v2.9.3.zip"
sha256 = "6299d8c42a29c2a44fabb2a43113067997fac5908c7748645da6958329c9951c"
addons = ["beehave-2.9.3/addons/beehave"]
autoloads = { BeehaveGlobalMetrics = "*res://addons/beehave/metrics/beehave_global_metrics.gd", BeehaveGlobalDebugger = "*res://addons/beehave/debug/global_debugger.gd" }
# lancé par le binaire de l'éditeur sans débogueur (tests sans fenêtre), le plugin envoie quand même ses messages
sorties_connues = ["ERROR: Can't send message. No active debugger", "ERROR: Capture not registered: 'beehave'."]

