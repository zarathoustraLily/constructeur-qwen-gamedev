# Modèle de configuration : copier en config.toml (ignoré par git) et adapter.
# Chemins Windows en chaînes littérales TOML ('...') pour garder les antislashs.

[godot]
version = "4.7.2"
console = 'D:\GODOT\Godot_v4.7.2-stable_win64.exe\Godot_v4.7.2-stable_win64_console.exe'
editeur = 'D:\GODOT\Godot_v4.7.2-stable_win64.exe\Godot_v4.7.2-stable_win64.exe'
# Binaire séparé pour GameDevBench (ses tâches tournent sous 4.4.1)
console_gamedevbench = 'A_RENSEIGNER'

[llm]
url = "http://127.0.0.1:8080/v1"
modele = "qwen3.8-27b"
cle = "sk-local"            # factice : llama-server l'ignore

[capture]
port_proxy = 8090           # OpenCode -> proxy (8090) -> llama-server (8080)

[opencode]
config_globale = '~/.config/opencode/opencode.json'
# Harnais OpenCode non interactif (session 5, production de données seulement ; à confirmer) :
cli = "opencode"            # moteur en ligne de commande : opencode run --format json --dir <copie> ...
fournisseur = 'A_RENSEIGNER' # id du fournisseur llama-server dans ta config OpenCode globale
modele = 'A_RENSEIGNER'      # « fournisseur/modèle » passé à --model
delai_s = 1800              # délai d'un essai OpenCode (production de données)

[chemins]
donnees = "donnees"
projets_godot = 'D:\GODOT'
docs_godot = 'A_RENSEIGNER'  # copie locale du dépôt godot-docs (branche 4.7)
demos_godot = 'A_RENSEIGNER' # copie locale de godot-demo-projects (tag 4.7-6ad6167)

[entrainement]
base_hf = 'A_RENSEIGNER'     # dossier HF de Qwen3.8-27B, par ex. sous G:\llm_lora_trainer\
convertisseur_lora = 'A_RENSEIGNER'  # convert_lora_to_gguf.py de llama.cpp

[juge]
delai_s = 300               # délai maximal d'un appel à Godot par le juge
# gdunit4 = 'D:\...\addons\gdUnit4'  # par défaut : godot/reference/addons/gdUnit4 du dépôt

[portillon]
repetitions = 3             # départ rouge et référence verte, N fois sur N
seuil_mutants = 0.5         # part minimale de mutants de la référence tués par les tests cachés
mutants_max = 8             # mutants évalués par tâche (tirage déterministe)
seuil_fragments = 0.8       # Jaccard des fragments de réponse au-delà duquel deux tâches sont des doublons

[rag]
vecteurs = false            # true : recherche aussi par vecteurs sqlite-vec (python -m usine.rag vecteurs)
demos_exclues = []          # projets de démo retirés de l'index, par ex. ["3d/truck_town"] s'il devient source de tâches gelées

[mesure]
# Même budget pour les 4 configurations (base ± RAG, LoRA ± RAG) : un appel par tâche, jamais de relance.
max_jetons = 4096
temperature = 0.0
graine = 1
delai_s = 600               # délai d'un appel à llama-server
n_docs = 5                  # extraits du RAG ajoutés au prompt (configurations « _rag »)
lora_ids = [0]              # adaptateurs chargés par llama-server (--lora), dans l'ordre ; [] si aucun
lora_actif = 0              # adaptateur mesuré (les autres sont envoyés à l'échelle 0)
max_pas = 40                # budget de l'agent maison pour les compétences agentiques (appels par tâche)

[frontiere]
# Référence frontière : appel EXTERNE, désactivé. Jamais lancé automatiquement.
# python -m usine.mesure.frontiere --appel-externe (depuis le mini-PC en ligne)
active = false
protocole = "openai"        # openai (chat/completions, schéma JSON) ou anthropic (API Messages)
url = 'A_RENSEIGNER'        # par ex. https://api.anthropic.com/v1
modele = 'A_RENSEIGNER'
cle_env = "FRONTIERE_CLE"   # variable d'environnement qui porte la clé (jamais la clé ici)

[gamedevbench]
depot = 'A_RENSEIGNER'      # copie du dépôt waynchi/gamedevbench (récupérée en ligne sur le mini-PC)
modele = "llamacpp/qwen"    # fournisseur/modèle tel que déclaré dans la config OpenCode
confinement = "off"         # « strict » exige Linux et bubblewrap ; « off » : résultat marqué non confiné
python = ["uv", "run", "python"]

[rft]
# Boucle RFT (session 5) : python -m usine.rft tour --sortie donnees\rft\t1
n_essais = 8                # essais par tâche
mini_reussites = 1          # filtre de difficulté : tâche gardée si réussie entre mini et maxi fois sur n_essais
maxi_reussites = 6          # au-delà : déjà acquise, non exportée (-1 : sans plafond)
temperature = 0.7           # > 0 : sinon les N essais d'une tâche en un appel seraient identiques
graine = 1                  # graine de l'essai n = graine + n
lora_id = -1                # -1 : réglage du serveur ; sinon id du LoRA (ordre des --lora) à l'échelle 1
avec_rag = false            # extraits du RAG dans le prompt des compétences en un appel
harnais = "agent"           # compétences agentiques : agent (maison) ou opencode
max_pas = 40                # budget de l'agent maison (appels au modèle par essai)
serveur_llama = 'A_RENSEIGNER'  # llama-server.exe (lanceur multi-LoRA : python -m usine.rft lanceur)
modele_gguf = 'A_RENSEIGNER'    # Qwen3.8-27B GGUF Q4
