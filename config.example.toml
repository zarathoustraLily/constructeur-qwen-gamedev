# Modèle de configuration : copier en config.toml (ignoré par git) et adapter.
# Chemins Windows en chaînes littérales TOML ('...') pour garder les antislashs.

[godot]
version = "4.7.2"
console = 'D:\GODOT\Godot_v4.7.2-stable_win64.exe\Godot_v4.7.2-stable_win64_console.exe'
editeur = 'D:\GODOT\Godot_v4.7.2-stable_win64.exe\Godot_v4.7.2-stable_win64.exe'
# Binaire séparé pour GameDevBench (ses tâches tournent sous 4.4.1)
console_gamedevbench = 'A_RENSEIGNER'

[llm]
url = "http://127.0.0.1:8080/v1"
modele = "qwen3.8-27b"
cle = "sk-local"            # factice : llama-server l'ignore

[capture]
port_proxy = 8090           # OpenCode -> proxy (8090) -> llama-server (8080)

[opencode]
config_globale = '~/.config/opencode/opencode.json'

[chemins]
donnees = "donnees"
projets_godot = 'D:\GODOT'
docs_godot = 'A_RENSEIGNER'  # copie locale du dépôt godot-docs (branche 4.7)

[entrainement]
base_hf = 'A_RENSEIGNER'     # dossier HF de Qwen3.8-27B, par ex. sous G:\llm_lora_trainer\
convertisseur_lora = 'A_RENSEIGNER'  # convert_lora_to_gguf.py de llama.cpp

[juge]
delai_s = 300               # délai maximal d'un appel à Godot par le juge
# gdunit4 = 'D:\...\addons\gdUnit4'  # par défaut : godot/reference/addons/gdUnit4 du dépôt

[portillon]
repetitions = 3             # départ rouge et référence verte, N fois sur N
seuil_mutants = 0.5         # part minimale de mutants de la référence tués par les tests cachés
mutants_max = 8             # mutants évalués par tâche (tirage déterministe)
seuil_fragments = 0.8       # Jaccard des fragments de réponse au-delà duquel deux tâches sont des doublons
